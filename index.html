    <script>
      (function () {
        try {
          var stored = localStorage.getItem('iqra-theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
        try {
          var settings = JSON.parse(localStorage.getItem('iqra-settings') || 'null')
          var scale = settings && settings.state && settings.state.textScale
          var percent = { normal: '100%', large: '112.5%', xlarge: '125%' }[scale]
          if (percent) document.documentElement.style.fontSize = percent
        } catch (e) {}
      })()
    </script>
